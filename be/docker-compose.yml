services:
  postgres:
    image: postgres:15-alpine
    container_name: cellphones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cellphones
      POSTGRES_USER: cellphones_user
      POSTGRES_PASSWORD: cellphones_password
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
