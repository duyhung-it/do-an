spring.application.name=b2b-ecommerce-api
server.port=8080

spring.jackson.default-property-inclusion=non_null

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cellphones}
spring.datasource.username=${DB_USERNAME:cellphones_user}
spring.datasource.password=${DB_PASSWORD:cellphones_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
