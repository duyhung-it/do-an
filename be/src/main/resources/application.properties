spring.application.name=b2b-ecommerce-api
server.port=8080

spring.jackson.default-property-inclusion=non_null

springdoc.swagger-ui.path=/swagger-npui.html
springdoc.api-docs.path=/v3/api-docs

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cellphones}
spring.datasource.username=${DB_USERNAME:cellphones_user}
spring.datasource.password=${DB_PASSWORD:cellphones_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# VNPay sandbox. Override these with real sandbox credentials from VNPay portal before external QA.
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.tmn-code=${VNPAY_TMN_CODE:VZ5ZPNQT}
vnpay.hash-secret=${VNPAY_HASH_SECRET:ZGAWKRS0JM60P0HQALQU9Q5M2FQDYA4T}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/gateway/return}
vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:15}
